<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gift Design Agent — Live Demo</title>
<style>
  :root {
    --bg: #0f1420; --panel: #161d2e; --panel2: #1c2740; --line: #2a3550;
    --text: #e6edf3; --muted: #8b98b5; --accent: #ffd43b; --blue: #4b8bbe;
    --green: #2fbf71; --pink: #ff7597;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1a2e4d 0, transparent 60%), var(--bg);
    color: var(--text); height: 100vh; overflow: hidden;
  }
  header {
    padding: 14px 22px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; }
  header .sub { color: var(--muted); font-size: 13px; }
  .bar { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  input#req {
    width: 460px; max-width: 42vw; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 13px;
  }
  button#run {
    padding: 9px 18px; border: none; border-radius: 8px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #ffb703); color: #1a1a1a;
    font-weight: 700; font-size: 13px;
  }
  button#run:disabled { opacity: .5; cursor: default; }

  main { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 59px); }
  .col { overflow-y: auto; padding: 20px; }
  .col.left { border-right: 1px solid var(--line); }
  .col h2 {
    font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); margin: 0 0 14px;
  }

  /* Left: final recommendation */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .placeholder { color: var(--muted); font-size: 14px; line-height: 1.6; }
  .prod { display: flex; align-items: center; gap: 12px; }
  .prod .name { font-size: 20px; font-weight: 700; }
  .prod .price { margin-left: auto; background: var(--panel2); padding: 4px 12px; border-radius: 20px; color: var(--green); font-weight: 700; }
  .imgrow { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .imgbox { background: var(--panel2); border-radius: 12px; padding: 8px; }
  .imgbox .lbl { font-size: 11px; color: var(--muted); text-align: center; margin-top: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .imgbox svg, .imgbox img { width: 100%; height: auto; border-radius: 8px; display: block; }
  .reason { line-height: 1.7; font-size: 15px; }

  /* Right: agent trace */
  .col.right { background: linear-gradient(180deg, #0d1220, #0f1420); }
  .trace { font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; }
  .step {
    border-left: 2px solid var(--line); padding: 6px 0 6px 16px; margin-left: 8px; position: relative;
    animation: pop .25s ease;
  }
  .step::before {
    content: ""; position: absolute; left: -6px; top: 12px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 3px var(--bg);
  }
  .step.thought::before { background: var(--muted); }
  .step.action::before { background: var(--blue); }
  .step.observation::before { background: var(--green); }
  .step.result::before { background: var(--pink); }
  .step .num { color: var(--muted); }
  .step .ttl { font-weight: 700; }
  .step.action .ttl { color: var(--blue); }
  .step.observation .ttl { color: var(--green); }
  .step.result .ttl { color: var(--pink); }
  .step .body { color: #cdd6e6; white-space: pre-wrap; margin-top: 3px; padding-left: 2px; }
  .step .body .code { color: #a8dadc; }
  .step .thumb { max-width: 180px; border-radius: 8px; display: block; margin-top: 6px; border: 1px solid var(--line); }

  @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .spinner { display:inline-block; width:12px; height:12px; border:2px solid var(--line); border-top-color: var(--accent); border-radius:50%; animation: spin .8s linear infinite; vertical-align:-1px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .col::-webkit-scrollbar { width: 8px; } .col::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
</style>
</head>
<body>
<header>
  <h1>🎁 Gift Design Agent</h1>
  <span class="sub">LangGraph · ReAct-style tool loop</span>
  <div class="bar">
    <input id="req" value="My programmer friend's birthday is coming up. I want to get him a gift. He likes Python." />
    <button id="run">Run Agent ▶</button>
  </div>
</header>

<main>
  <section class="col left">
    <h2>Final Recommendation</h2>
    <div id="result">
      <div class="card placeholder">Press <b>Run Agent</b> to watch it decide which tools to call —
        search products, generate the design, and compose the product preview.</div>
    </div>
  </section>

  <section class="col right">
    <h2>Agent Trace <span id="status"></span></h2>
    <div id="trace" class="trace">
      <div class="placeholder">Waiting to start…</div>
    </div>
  </section>
</main>

<script>
const traceEl = document.getElementById('trace');
const resultEl = document.getElementById('result');
const statusEl = document.getElementById('status');
const runBtn = document.getElementById('run');
const reqInput = document.getElementById('req');

let es = null;
const store = {};  // accumulates data fields for the left panel

function esc(s){ return (s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function addTrace(ev){
  const d = document.createElement('div');
  d.className = 'step ' + (ev.kind || '');
  let body = '';
  if (ev.text) body += `<div class="body">${esc(ev.text)}</div>`;
  if (ev.lines && ev.lines.length)
    body += `<div class="body">${ev.lines.map(l=>`<span class="code">${esc(l)}</span>`).join('\n')}</div>`;
  if (ev.image) body += `<img class="thumb" src="${ev.image}" alt="tool output">`;
  d.innerHTML = `<div><span class="num">[${ev.step}]</span> <span class="ttl">${esc(ev.title)}</span></div>${body}`;
  traceEl.appendChild(d);
  traceEl.parentElement.scrollTop = traceEl.parentElement.scrollHeight;
}

function renderResult(){
  const p = store.selected_product;
  if (!p && !store.design_svg) return;
  let html = '';
  if (p) html += `<div class="card"><div class="prod">
      <span style="font-size:26px">🎁</span>
      <span class="name">${esc(p.name)}</span>
      <span class="price">$${p.price}</span></div>
      <div style="color:var(--muted);font-size:13px;margin-top:6px">${esc(p.note||'')}</div></div>`;
  if (store.design_svg || store.preview_svg) {
    const designImg = store.design_svg ? `<img src="${store.design_svg}" alt="AI design">` : '<div class="placeholder">generating…</div>';
    const previewImg = store.preview_svg ? `<img src="${store.preview_svg}" alt="product preview">` : '<div class="placeholder">waiting…</div>';
    html += `<div class="card"><div class="imgrow">
      <div class="imgbox">${designImg}<div class="lbl">AI Design</div></div>
      <div class="imgbox">${previewImg}<div class="lbl">Product Preview</div></div>
      </div></div>`;
  }
  if (store.reasoning) html += `<div class="card"><div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Why this gift</div>
      <div class="reason">${esc(store.reasoning)}</div></div>`;
  resultEl.innerHTML = html;
}

function start(){
  if (es) es.close();
  for (const k in store) delete store[k];
  traceEl.innerHTML = '';
  resultEl.innerHTML = '<div class="card placeholder">Agent is working… results will appear here.</div>';
  runBtn.disabled = true;
  statusEl.innerHTML = '<span class="spinner"></span>';

  es = new EventSource('/run?request=' + encodeURIComponent(reqInput.value));
  es.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.type === 'trace') addTrace(ev);
    else if (ev.type === 'data') { store[ev.field] = ev.value; renderResult(); }
    else if (ev.type === 'done') { es.close(); runBtn.disabled = false; statusEl.textContent = '✓ done'; }
  };
  es.onerror = () => { es.close(); runBtn.disabled = false; statusEl.textContent = ''; };
}

runBtn.addEventListener('click', start);
</script>
</body>
</html>
